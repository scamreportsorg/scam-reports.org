name: Deploy staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy private staging
    if: vars.ENABLE_STAGING_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_SMOKE_URL: ${{ vars.STAGING_SMOKE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:e2e
          node scripts/audit-publication.mjs
          node scripts/check-licenses.mjs
      - name: Build staging artifact
        env:
          PUBLIC_RELEASE_VERSION: 0.2.10-staging
          PUBLIC_SOURCE_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.STAGING_TURNSTILE_SITE_KEY }}
          STAGING_D1_DATABASE_ID: ${{ secrets.STAGING_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          : "${STAGING_D1_DATABASE_ID:?missing protected STAGING_D1_DATABASE_ID}"
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
          export PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:staging
          node scripts/prepare-deployment-config.mjs --source dist/server/wrangler.json --target staging
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("dist/server/wrangler.json", "utf8"));
          if (config.vars.PUBLIC_SOURCE_COMMIT !== process.env.PUBLIC_SOURCE_COMMIT) throw new Error("Generated staging commit mismatch.");
          if (config.vars.PUBLIC_TURNSTILE_SITE_KEY !== process.env.NEXT_PUBLIC_TURNSTILE_SITE_KEY) throw new Error("Generated staging Turnstile key mismatch.");
          if (config.d1_databases?.find((item) => item.binding === "DB")?.database_id !== process.env.STAGING_D1_DATABASE_ID) throw new Error("Generated staging D1 binding mismatch.");
          NODE
      - name: Apply additive staging migrations from generated config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply scam-reports-staging --remote --config dist/server/wrangler.json
      - name: Load the bounded synthetic performance fixture into private staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_D1_DATABASE_ID: ${{ secrets.STAGING_D1_DATABASE_ID }}
        run: node scripts/seed-staging-performance.mjs --database scam-reports-staging --config dist/server/wrangler.json
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Verify remote staging identity, bounds, and performance
        env:
          STAGING_BEARER: ${{ secrets.STAGING_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_SMOKE_URL:?missing protected STAGING_SMOKE_URL}"
          : "${STAGING_BEARER:?missing protected STAGING_ACCESS_TOKEN}"
          node scripts/remote-smoke.mjs \
            --base-url "$STAGING_SMOKE_URL" \
            --expected-origin https://staging.scam-reports.org \
            --expected-commit "$GITHUB_SHA" \
            --expected-version 0.2.10-staging \
            --bearer-env STAGING_BEARER \
            --require-staging-fixture \
            --samples 20 \
            --max-p95-ms 500 \
            --min-reports 1000 \
            --min-reviews 10000
